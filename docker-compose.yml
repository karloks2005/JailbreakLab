services:
   backend:
      build:
         context: ./backend
         args:
            GUARDRAILS_API_KEY: ${GUARDRAILS_API_KEY}
      env_file: .env
      container_name: projekt-backend
      ports:
         - "8000:8000"
      volumes:
         - ./backend:/app
      command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      deploy:
         resources:
            reservations:
               cpus: "1"
      environment:
         - REDIS_URL=redis://redis:6379/0
        # - NVIDIA_VISIBLE_DEVICES=all
      #runtime: nvidia
      depends_on:
         - redis

   frontend:
      image: node:20-alpine
      container_name: projekt-frontend
      working_dir: /app
      ports:
         - "5173:5173"
      volumes:
         - ./frontend:/app
         - /app/node_modules
      environment:
         - VITE_API_URL=http://backend:8000
      command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
      depends_on:
         - backend

   redis:
      image: redis:7
      container_name: projekt-redis
      restart: unless-stopped
      volumes:
         - redis-data:/data
      healthcheck:
         test: ["CMD", "redis-cli", "ping"]
         interval: 10s
         timeout: 5s
         retries: 3

volumes:
   redis-data:
